<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장인건 포트폴리오</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f4f4f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  }
  .toolbar {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: #111;
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
  }
  .toolbar a {
    color: #fff;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.35);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
  .toolbar a:hover { background: rgba(255,255,255,0.1); }
  .pdf-wrap {
    width: 100%;
    height: calc(100% - 48px);
  }
  iframe, embed {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  /* 모바일에서 iframe이 PDF를 못 띄우는 경우 대비 안내 */
  .fallback {
    display: none;
    padding: 40px 20px;
    text-align: center;
    color: #333;
  }
  .fallback a {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 20px;
    background: #111;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span>장인건 포트폴리오</span>
    <a href="portfolio.pdf" download="">다운로드</a>
  </div>
  <div class="pdf-wrap">
    <iframe src="portfolio.pdf" title="장인건 포트폴리오"></iframe>
  </div>


</body></html>
